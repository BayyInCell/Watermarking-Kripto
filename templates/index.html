<!doctype html><html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Watermark DCT — Uji Ketahanan</title>
<style>
:root{--bg:#eef1f4;--ink:#14213d;--mut:#5b6678;--acc:#0f8b8d;--bad:#c8553d;--line:#c9d0da}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "IBM Plex Sans",system-ui,sans-serif}
main{max-width:1100px;margin:0 auto;padding:24px 16px 64px}h1{font-size:26px;margin:0 0 4px}
p.sub{margin:0 0 20px;color:var(--mut)}section{border-top:2px solid var(--ink);padding:14px 0 22px}
h2{font-size:17px;margin:0 0 10px}label{display:block;margin:6px 0 2px;color:var(--mut)}
input,select,button{font:inherit;padding:7px 10px;border:1px solid var(--line);background:#fff;border-radius:4px}
button{cursor:pointer;background:var(--ink);color:#fff;border-color:var(--ink)}button.sec{background:#fff;color:var(--ink)}
button:hover:not(:disabled){background:var(--acc);border-color:var(--acc);color:#fff}button:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:end}.imgs{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
figure{margin:0}figure img{width:100%;background:#dde2e8;min-height:60px}figcaption{color:var(--mut);font-size:13px}
.atk{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
table{border-collapse:collapse;width:100%;background:#fff}th,td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:left}
.ok{color:var(--acc);font-weight:600}.no{color:var(--bad);font-weight:600}#msg{color:var(--bad);min-height:22px}
</style></head><body><main>
<h1>Watermark DCT blind</h1>
<p class="sub">Sisipkan logo biner atau teks identitas, serang citranya, lalu lihat apakah watermark masih terbaca.</p>
<section><h2>1. Sisipkan watermark</h2>
<div class="row">
<div><label for="img">Citra asli</label><input id="img" type="file" accept="image/*"></div>
<div><label for="mode">Jenis watermark</label><select id="mode"><option value="text">Teks (mis. NPM)</option><option value="logo">Logo biner</option></select></div>
<div id="tw"><label for="text">Teks</label><input id="text" value="247006111107"></div>
<div id="lw" hidden><label for="logo">Logo (jadi 32×32 hitam-putih)</label><input id="logo" type="file" accept="image/*"></div>
<div><label for="str">Kekuatan (α)</label><input id="str" type="number" value="30" min="5" max="100" style="width:80px"></div>
<button id="go">Sisipkan</button></div><div id="msg" role="alert"></div>
<p id="info" class="sub"></p></section>
<section><h2>2. Serang citra ber-watermark</h2><div class="atk" id="atk"></div>
<div class="imgs"><figure><img id="o" alt=""><figcaption>Asli</figcaption></figure>
<figure><img id="w" alt=""><figcaption>Ber-watermark</figcaption></figure>
<figure><img id="a" alt=""><figcaption id="acap">Setelah serangan</figcaption></figure>
<figure><img id="x" alt=""><figcaption id="xcap">Hasil ekstraksi</figcaption></figure></div></section>
<section><h2>3. Hasil pengujian</h2>
<table><thead><tr><th>Serangan</th><th>PSNR vs ber-watermark (dB)</th><th>NC</th><th>BER</th><th>Terbaca</th></tr></thead><tbody id="log"></tbody></table></section>
<script>
const $=i=>document.getElementById(i);let orig,wmBlob,kid;
const A=[["Tanpa serangan","jpeg",100],["JPEG Q90","jpeg",90],["JPEG Q70","jpeg",70],["JPEG Q50","jpeg",50],
["Crop 75%","crop",.75],["Crop 50%","crop",.5],["Resize 75%","resize",.75],["Resize 50%","resize",.5],
["Derau Gaussian σ=5","gaussian",5],["Derau Gaussian σ=15","gaussian",15],["Kecerahan +30","brightness",30],["Kecerahan −30","brightness",-30],
["Kontras ×1.3","contrast",1.3],["Kontras ×0.7","contrast",.7]];
A.forEach(([l,k,p])=>{const b=document.createElement("button");b.className="sec";b.textContent=l;b.disabled=true;b.onclick=()=>run(l,k,p);$("atk").append(b)});
$("mode").onchange=()=>{$("tw").hidden=$("mode").value!="text";$("lw").hidden=$("mode").value!="logo"};
const blob=u=>fetch(u).then(r=>r.blob());const err=e=>$("msg").textContent=e;
async function post(u,fd){const r=await fetch(u,{method:"POST",body:fd});const j=await r.json();if(!r.ok)throw new Error(j.error);return j}
$("go").onclick=async()=>{err("");try{orig=$("img").files[0];if(!orig)throw new Error("Pilih citra asli dulu");
const f=new FormData();f.append("image",orig);f.append("mode",$("mode").value);f.append("text",$("text").value);f.append("strength",$("str").value);
if($("mode").value=="logo"){if(!$("logo").files[0])throw new Error("Pilih file logo");f.append("logo",$("logo").files[0])}
const j=await post("/api/embed",f);kid=j.key_id;wmBlob=await blob(j.image);$("o").src=URL.createObjectURL(orig);$("w").src=j.image;
$("info").textContent=`PSNR citra ber-watermark terhadap asli: ${j.psnr.toFixed(2)} dB · ${j.nbits} bit · kunci acak tersimpan di server (ID ${kid})`;
$("log").innerHTML="";document.querySelectorAll("#atk button").forEach(b=>b.disabled=false)}catch(e){err(e.message)}};
async function run(l,k,p){err("");try{const f=new FormData();f.append("image",wmBlob,"w.png");f.append("attack",k);f.append("param",p);
const a=await post("/api/attack",f);$("a").src=a.image;$("acap").textContent="Setelah: "+l;
const g=new FormData();g.append("image",await blob(a.image),"a.png");g.append("key_id",kid);const x=await post("/api/extract",g);
$("x").src=x.logo||"";$("xcap").textContent=x.text!==undefined?`Teks terbaca: ${x.text}`:"Logo terekstraksi";
const ok=x.ber<.1;$("log").insertAdjacentHTML("beforeend",`<tr><td>${l}</td><td>${a.psnr==null?"∞":a.psnr.toFixed(2)}</td><td>${x.nc.toFixed(3)}</td><td>${x.ber.toFixed(3)}</td><td class="${ok?"ok":"no"}">${ok?"ya":"tidak"}</td></tr>`)}catch(e){err(e.message)}}
</script></main></body></html>
